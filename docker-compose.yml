version: '3.8'

services:
  sneaker-store-backend:
    build: .
    container_name: sneaker-store-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=${DB_URL:-jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
      - DB_USERNAME=${DB_USERNAME:-SNEAKER_STORE}
      - DB_PASSWORD=${DB_PASSWORD:-SneakerStore123}
    restart: unless-stopped

